# Separate IAM scoped backend on the existing IAM instance.
server {
    listen 80;
    listen [::]:80;
    server_name scoped.backend.iam.teamofsilicons.com;
    root /var/www/certbot;
    access_log off;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scoped.backend.iam.teamofsilicons.com;
    ssl_certificate /etc/letsencrypt/live/scoped.backend.iam.teamofsilicons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoped.backend.iam.teamofsilicons.com/privkey.pem;

    # IAM APIs carry credentials and private directory data. Do not log URIs,
    # query strings, Authorization headers, or upstream bodies here.
    access_log off;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
