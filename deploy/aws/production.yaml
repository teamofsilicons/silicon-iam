AWSTemplateFormatVersion: "2010-09-09"
Description: Silicon IAM with explicit retained direct-nginx or legacy load-balancer ingress.

Parameters:
  DirectNginx:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Reuse the singleton public ENI and secured TLS state; do not create an edge stack.
  PublicNetworkInterfaceId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^eni-[a-f0-9]+$'
    Description: Existing retained public ENI in PrivateSubnetA's Availability Zone.
  ScopedWebhookSecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Existing dedicated scoped webhook keyring; never generate a replacement.
  TlsArchiveBucket:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Existing private bucket holding the AES256-encrypted ingress recovery archive.
  TlsArchiveKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._/-]{0,499}$'
  TlsArchiveSha256:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-f0-9]{64}$'
  TlsArchiveVersionId:
    Type: String
    Default: ""
    MaxLength: 1024
    AllowedPattern: '^$|^[A-Za-z0-9._~+/=-]+$'
    Description: Pinned version of the existing private ingress archive object.
  DedicatedTargetGroupArn:
    Type: String
    Default: ""
    Description: Target group output of this service's dedicated edge stack.
  UseSharedLoadBalancer:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Keep true during DNS migration; false removes only this service's shared ingress and routing.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  HttpsListenerArn:
    Type: String
  CertificateArn:
    Type: String
  AppSecretArn:
    Type: String
  BackendImageUri:
    Type: String
    AllowedPattern: '^[A-Za-z0-9._:/-]+@sha256:[a-f0-9]{64}$'
    Description: Exact verified release image shared by API, scoped API, worker and migrator.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  TestingDatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]

Rules:
  DirectIngressInputs:
    RuleCondition: !Equals [!Ref DirectNginx, "true"]
    Assertions:
      - Assert: !And
          - !Equals [!Ref UseSharedLoadBalancer, "false"]
          - !Equals [!Ref DedicatedTargetGroupArn, ""]
          - !Not [!Equals [!Ref PublicNetworkInterfaceId, ""]]
          - !Not [!Equals [!Ref ScopedWebhookSecretArn, ""]]
          - !Not [!Equals [!Ref TlsArchiveBucket, ""]]
          - !Not [!Equals [!Ref TlsArchiveKey, ""]]
          - !Not [!Equals [!Ref TlsArchiveSha256, ""]]
          - !Not [!Equals [!Ref TlsArchiveVersionId, ""]]
        AssertDescription: Direct ingress requires the existing ENI, scoped secret and pinned TLS archive, with both load-balancer modes disabled.
  RequireTrafficDestination:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref DirectNginx, "true"]
          - !Equals [!Ref UseSharedLoadBalancer, "true"]
          - !Not [!Equals [!Ref DedicatedTargetGroupArn, ""]]
        AssertDescription: Select direct nginx or an existing load-balancer destination.

Conditions:
  DirectIngress: !Equals [!Ref DirectNginx, "true"]
  SharedLoadBalancer: !Equals [!Ref UseSharedLoadBalancer, "true"]
  DedicatedLoadBalancer: !Not [!Equals [!Ref DedicatedTargetGroupArn, ""]]
  LoadBalancedIngress: !Or [!Condition SharedLoadBalancer, !Condition DedicatedLoadBalancer]

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Silicon IAM production instance; application ports are ALB-only
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - SharedLoadBalancer
        - - IpProtocol: tcp
            FromPort: 8080
            ToPort: 8080
            SourceSecurityGroupId: !Ref AlbSecurityGroupId
            Description: Shared ALB to IAM API
        - []
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: silicon-iam-production-instance
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  AlbToInstanceEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: SharedLoadBalancer
    Properties:
      GroupId: !Ref AlbSecurityGroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !GetAtt InstanceSecurityGroup.GroupId
      Description: Shared ALB to Silicon IAM production API

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Silicon IAM production and testing PostgreSQL; IAM instances only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
          Description: IAM production instances
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: silicon-iam-production-database
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Silicon IAM production
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: silicon-iam-production
      Engine: postgres
      EngineVersion: "17.9"
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: silicon_iam
      MasterUsername: silicon_iam_migrator
      ManageMasterUserPassword: true
      Port: 5432
      AllocatedStorage: "30"
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: silicon-iam-production
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  TestingDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: silicon-iam-testing-production
      Engine: postgres
      EngineVersion: "17.9"
      DBInstanceClass: !Ref TestingDatabaseInstanceClass
      DBName: silicon_iam_testing
      MasterUsername: silicon_iam_testing_migrator
      ManageMasterUserPassword: true
      Port: 5432
      AllocatedStorage: "20"
      MaxAllocatedStorage: 25
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: silicon-iam-testing-production
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: testing

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /silicon-iam/production/api
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /silicon-iam/production/worker
      RetentionInDays: 30

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: silicon-iam-production-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: silicon-iam-production-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/silicon-iam-production
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecretArn
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !GetAtt TestingDatabase.MasterUserSecret.SecretArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt ApiLogGroup.Arn
                  - !Sub ${ApiLogGroup.Arn}:*
                  - !GetAtt WorkerLogGroup.Arn
                  - !Sub ${WorkerLogGroup.Arn}:*
        - !If
          - DirectIngress
          - PolicyName: silicon-iam-direct-ingress
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ScopedWebhookSecretArn
                - Effect: Allow
                  Action: s3:GetObjectVersion
                  Resource: !Sub arn:${AWS::Partition}:s3:::${TlsArchiveBucket}/${TlsArchiveKey}
                  Condition:
                    StringEquals:
                      s3:VersionId: !Ref TlsArchiveVersionId
                - Effect: Allow
                  Action: ec2:DescribeNetworkInterfaces
                  Resource: "*"
                - Effect: Allow
                  Action: ec2:AttachNetworkInterface
                  Resource:
                    - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/${PublicNetworkInterfaceId}
                    - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/Service: silicon-iam
                - Effect: Allow
                  Action: ec2:ModifyNetworkInterfaceAttribute
                  Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/${PublicNetworkInterfaceId}
                  Condition:
                    StringEquals:
                      ec2:Attribute: Attachment
                      ec2:ResourceTag/Service: silicon-iam
                # Updating attachment retention also authorizes the attached
                # instance. That resource has no ec2:Attribute condition key;
                # keep its allow separate from the exact-ENI attribute allow.
                - Effect: Allow
                  Action: ec2:ModifyNetworkInterfaceAttribute
                  Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/Service: silicon-iam
                      ec2:ResourceTag/aws:autoscaling:groupName: silicon-iam-production
          - !Ref AWS::NoValue
      Tags:
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: SharedLoadBalancer
    Properties:
      Name: silicon-iam-prod-api
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /readyz
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Service
          Value: silicon-iam
        - Key: Environment
          Value: production

  ListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: SharedLoadBalancer
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Certificates:
        - CertificateArn: !Ref CertificateArn

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: SharedLoadBalancer
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [backend.iam.teamofsilicons.com]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: silicon-iam-production
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !GetAtt InstanceSecurityGroup.GroupId
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          InstanceMetadataTags: enabled
        Monitoring:
          Enabled: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 24
              VolumeType: gp3
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: silicon-iam-production
              - Key: Service
                Value: silicon-iam
              - Key: Environment
                Value: production
          - ResourceType: volume
            Tags:
              - Key: Service
                Value: silicon-iam
              - Key: Environment
                Value: production
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Generated by scripts/render-production-userdata.py; edit the readable sources.
            set -euo pipefail
            umask 077
            export REGION='${AWS::Region}'
            export ACCOUNT_ID='${AWS::AccountId}'
            export APP_SECRET_ARN='${AppSecretArn}'
            export DB_SECRET_ARN='${Database.MasterUserSecret.SecretArn}'
            export DB_HOST='${Database.Endpoint.Address}'
            export TEST_DB_SECRET_ARN='${TestingDatabase.MasterUserSecret.SecretArn}'
            export TEST_DB_HOST='${TestingDatabase.Endpoint.Address}'
            export BACKEND_IMAGE='${BackendImageUri}'
            export DIRECT_NGINX='${DirectNginx}'
            export PUBLIC_ENI='${PublicNetworkInterfaceId}'
            export SCOPED_WEBHOOK_SECRET_ARN='${ScopedWebhookSecretArn}'
            export TLS_ARCHIVE_BUCKET='${TlsArchiveBucket}'
            export TLS_ARCHIVE_KEY='${TlsArchiveKey}'
            export TLS_ARCHIVE_SHA256='${TlsArchiveSha256}'
            export TLS_ARCHIVE_VERSION_ID='${TlsArchiveVersionId}'
            install -d -m 0700 /opt/silicon-iam/provisioning
            base64 --decode <<'BOOTSTRAP_ARCHIVE' | tar --extract --gzip --file=- --directory=/opt/silicon-iam/provisioning
