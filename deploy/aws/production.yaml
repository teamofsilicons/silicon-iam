  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: silicon-iam-production
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      # The retained public ENI is AZ-bound. Direct mode must stay in its AZ;
      # bootstrap checks the actual ENI/instance AZ before any shared DB writes.
      VPCZoneIdentifier: !If
        - DirectIngress
        - [!Ref PrivateSubnetA]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: !If
        - DirectIngress
        - !Ref AWS::NoValue
        - - !If [SharedLoadBalancer, !Ref ApiTargetGroup, !Ref "AWS::NoValue"]
          - !If [DedicatedLoadBalancer, !Ref DedicatedTargetGroupArn, !Ref "AWS::NoValue"]
      HealthCheckType: !If [DirectIngress, EC2, ELB]
      HealthCheckGracePeriod: 1200
      NewInstancesProtectedFromScaleIn: false
      Tags:
        - Key: Service
          Value: silicon-iam
          PropagateAtLaunch: true
        - Key: Environment
          Value: production
          PropagateAtLaunch: true

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  TestingDatabaseEndpoint:
    Value: !GetAtt TestingDatabase.Endpoint.Address
  TestingDatabaseSecretArn:
    Value: !GetAtt TestingDatabase.MasterUserSecret.SecretArn
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  ApiTargetGroupArn:
    Condition: LoadBalancedIngress
    Value: !If [DedicatedLoadBalancer, !Ref DedicatedTargetGroupArn, !Ref ApiTargetGroup]
