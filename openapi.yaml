        webhook_signing_secret: { type: string, pattern: '^whs_[A-Za-z0-9_-]{43}$' }
        secret_version: { type: integer, minimum: 1 }
        previous_valid_until: { type: string, format: date-time }
        secret_replay_expires_at: { type: string, format: date-time }
    DeliveryStatus:
      type: string
      enum: [pending, delivering, delivered, retry_wait, dead_letter, cancelled]
    WebhookDeliveryAttempt:
      type: object
      required: [attempt, started_at, outcome]
      properties:
        attempt: { type: integer, minimum: 1 }
        started_at: { type: string, format: date-time }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        outcome: { type: string, enum: [success, http_error, network_error, timeout, rejected] }
        response_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        response_body_digest: { type: [string, 'null'] }
    WebhookDelivery:
      type: object
      required: [id, destination_type, destination_id, event_id, event_type, aggregate_id, aggregate_version, status, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        destination_type: { type: string, enum: [application, silicon_hook] }
        destination_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        aggregate_id: { type: string, format: uuid }
        aggregate_version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attempts: { type: array, items: { $ref: '#/components/schemas/WebhookDeliveryAttempt' } }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDeliveryPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    WebhookEvent:
      type: object
      required: [spec_version, event_id, event_type, occurred_at, aggregate, data]
      properties:
        spec_version: { const: '1.0' }
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+\.v[1-9][0-9]*$'
          description: Stable dotted event name with its positive schema version suffix.
        occurred_at: { type: string, format: date-time }
        organization_id: { type: [string, 'null'], format: uuid }
        aggregate:
          type: object
          required: [id, type, version]
          properties:
            id: { type: string, format: uuid }
            type: { type: string }
            version: { type: integer, minimum: 1 }
        data: { type: object, additionalProperties: true, description: Event-type-specific minimal projection; never contains credentials or raw provider records. }
    ApplicationAdminDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, reject, suspend, reactivate, approve_pending_changes, reject_pending_changes] }
        approved_scopes: { type: array, uniqueItems: true, items: { type: string } }
        notify_users: { type: boolean }
        reason: { type: [string, 'null'], maxLength: 2000 }
    OboAction:
      type: string
      enum:
        - organization.update
        - members.invite
        - members.update_directory
        - members.remove
        - silicons.create
        - silicons.update_directory
        - silicons.manage_hierarchy
        - silicons.remove
        - silicons.rotate_token
        - tags.manage
        - trust.manage
        - roles.request
        - roles.approve
        - admins.create
        - admins.manage
        - sso.manage
        - audit.read
    OboExchangeRequest:
      type: object
      required: [subject_token, audience, action, org_id]
      additionalProperties: false
      properties:
        subject_token: { type: string, minLength: 32, maxLength: 4096, description: Actor-bound application access token issued to the calling app. }
        audience: { $ref: '#/components/schemas/AppId' }
        action: { $ref: '#/components/schemas/OboAction' }
        resource: { type: [string, 'null'], maxLength: 1024 }
        org_id: { $ref: '#/components/schemas/OrgId' }
    OboProofResponse:
      type: object
      required: [access_proof, proof_id, expires_in, expires_at]
      properties:
        access_proof: { type: string, pattern: '^obo_[A-Za-z0-9_-]{43}$' }
        proof_id: { type: string, format: uuid }
        expires_in: { type: integer, maximum: 60, default: 60 }
        expires_at: { type: string, format: date-time }
    OboVerifyRequest:
      type: object
      required: [access_proof, audience, action]
      additionalProperties: false
      properties:
        access_proof: { type: string, pattern: '^obo_[A-Za-z0-9_-]{43}$' }
        audience: { $ref: '#/components/schemas/AppId' }
        action: { $ref: '#/components/schemas/OboAction' }
        resource: { type: [string, 'null'], maxLength: 1024 }
    OboAccessResult:
      type: object
      required: [valid, proof_id, issuer_app_id, audience, actor, org_id, action, expires_at, consumed_at]
      properties:
        valid: { const: true }
        proof_id: { type: string, format: uuid }
        issuer_app_id: { $ref: '#/components/schemas/AppId' }
        audience: { $ref: '#/components/schemas/AppId' }
        actor: { $ref: '#/components/schemas/ActorRef' }
        org_id: { $ref: '#/components/schemas/OrgId' }
        action: { $ref: '#/components/schemas/OboAction' }
        resource: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, actor, target_type, request_id, occurred_at, redacted_diff]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: [string, 'null'] }
        app_id: { type: [string, 'null'] }
        actor:
          oneOf:
            - { $ref: '#/components/schemas/ActorRef' }
            - { type: 'null' }
        effective_actor:
          oneOf:
            - { $ref: '#/components/schemas/ActorRef' }
            - { type: 'null' }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string }
        auth_method: { type: [string, 'null'] }
        ip_prefix: { type: [string, 'null'] }
        user_agent_summary: { type: [string, 'null'] }
        redacted_diff: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    AuditEventPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    PlatformAdministratorCreate:
      type: object
      required: [carbon_id]
      additionalProperties: false
      properties: { carbon_id: { $ref: '#/components/schemas/CarbonId' } }
    PlatformAdministrator:
      type: object
      required: [principal, created_by, created_at]
      properties:
        principal: { $ref: '#/components/schemas/ActorRef' }
        created_by:
          oneOf:
            - { $ref: '#/components/schemas/ActorRef' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
    PlatformAdministratorPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformAdministrator' } }
        page: { $ref: '#/components/schemas/PageInfo' }
