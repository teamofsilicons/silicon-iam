openapi: 3.1.0
info:
  title: Silicon IAM API
  version: 1.0.0
  summary: Secure identity, organization governance, application login, and delegated access.
  description: |
    Normative public and privileged HTTP contract for Silicon IAM. PostgreSQL is
    authoritative; webhook delivery never substitutes for online authorization.
    Timestamps are UTC RFC 3339 values. One-time secret responses can be replayed
    for ten minutes only by the same caller using the same route, request digest,
    and Idempotency-Key.
  contact: { email: auth@teamofsilicons.com }
servers:
  - { url: 'https://backend.iam.teamofsilicons.com', description: Production }
tags:
  - { name: System }
  - { name: Carbon signup }
  - { name: Carbon authentication }
  - { name: Carbon account }
  - { name: OAuth and OIDC }
  - { name: Organizations }
  - { name: Memberships }
  - { name: Invitations }
  - { name: Silicons }
  - { name: Tags }
  - { name: Trust }
  - { name: Governance }
  - { name: SSO }
  - { name: Applications }
  - { name: OBO Access }
  - { name: Webhooks }
  - { name: Audit }
  - { name: Platform administration }

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/version:
    get:
      tags: [System]
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Running contract and build version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
  /.well-known/openid-configuration:
    get:
      tags: [OAuth and OIDC]
      operationId: getOpenIdConfiguration
      security: []
      responses:
        '200':
          description: OpenID Provider metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenIdConfiguration' }
  /.well-known/jwks.json:
    get:
      tags: [OAuth and OIDC]
      operationId: getJsonWebKeySet
      security: []
      responses:
        '200':
          description: Keys for signed ID tokens; IAM access tokens are opaque.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }

  /api/v1/signup/sessions:
    post:
      tags: [Carbon signup]
      operationId: createSignupSession
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Signup session created for 48 hours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/signup/sessions/{session_id}/email:
    post:
      tags: [Carbon signup]
      operationId: sendSignupEmailCode
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202': { $ref: '#/components/responses/CodeDispatchAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/signup/sessions/{session_id}/email/verify:
    post:
      tags: [Carbon signup]
      operationId: verifySignupEmail
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/VerificationCode' }
      responses:
        '200': { $ref: '#/components/responses/Verified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/signup/sessions/{session_id}/phone:
    post:
      tags: [Carbon signup]
      operationId: sendSignupPhoneCode
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneInput' }
      responses:
        '202': { $ref: '#/components/responses/CodeDispatchAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/signup/sessions/{session_id}/phone/verify:
    post:
      tags: [Carbon signup]
      operationId: verifySignupPhone
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/VerificationCode' }
      responses:
        '200': { $ref: '#/components/responses/Verified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/signup/sessions/{session_id}/complete:
    post:
      tags: [Carbon signup]
      operationId: completeCarbonSignup
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarbonSignupComplete' }
      responses:
        '201':
          description: Carbon created after verified identities are rechecked atomically.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarbonSelf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/carbon-ids/{carbon_id}/availability:
    get:
      tags: [Carbon signup]
      operationId: checkCarbonIdAvailability
      security: []
      parameters: [{ $ref: '#/components/parameters/CarbonIdPath' }]
      responses:
        '200':
          description: Current availability; this does not reserve the handle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/carbons/search:
    get:
      tags: [Carbon account]
      operationId: searchCarbons
      security: [{ iamBearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 10 } }
      responses:
        '200':
          description: Public profiles only; contact identifiers are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/CarbonPublic' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/oauth/authorize:
    get:
      tags: [OAuth and OIDC]
      operationId: authorizeApplication
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: client_id, in: query, required: true, schema: { $ref: '#/components/schemas/AppId' } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri, maxLength: 2048 } }
        - { name: scope, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2000 } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
        - { name: nonce, in: query, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43,128}$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
        - { name: org_id, in: query, schema: { $ref: '#/components/schemas/OrgId' } }
      responses:
        '200':
          description: Consent HTML when an explicit decision is required.
          content: { text/html: { schema: { type: string } } }
        '302':
          description: Exact registered redirect with code or protocol error and unchanged state.
          headers: { Location: { schema: { type: string, format: uri } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/oauth/authorize/decisions:
    post:
      tags: [OAuth and OIDC]
      operationId: decideOAuthConsent
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthConsentDecision' }
      responses:
        '302':
          description: Exact registered redirect containing code or access_denied and unchanged state.
          headers: { Location: { schema: { type: string, format: uri } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/oauth/token:
    post:
      tags: [OAuth and OIDC]
      operationId: exchangeOAuthToken
      security: [{ applicationBasic: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthTokenRequest' }
      responses:
        '200':
          description: OIDC response; access/refresh tokens are opaque and the ID token is signed.
          headers:
            Cache-Control: { schema: { const: no-store } }
            Pragma: { schema: { const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/oauth/introspect:
    post:
      tags: [OAuth and OIDC]
      operationId: introspectOAuthToken
      security: [{ applicationBasic: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgContext' }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenIntrospectionRequest' }
      responses:
        '200':
          description: Activity after current revocation and membership checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIntrospection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/oauth/revoke:
    post:
      tags: [OAuth and OIDC]
      operationId: revokeOAuthToken
      security: [{ applicationBasic: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthRevocationRequest' }
      responses:
        '200': { description: Revocation accepted; unknown tokens also return 200. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/oauth/userinfo:
    get:
      tags: [OAuth and OIDC]
      operationId: getOAuthUserInfo
      security: [{ iamBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgContext' }]
      responses:
        '200':
          description: Claims limited to approved scopes and selected organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/me/application-grants:
    get:
      tags: [OAuth and OIDC, Carbon account]
      operationId: listCurrentCarbonApplicationGrants
      security: [{ iamBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Current application consent grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationGrantPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/me/application-grants/{grant_id}:
    delete:
      tags: [OAuth and OIDC, Carbon account]
      operationId: revokeCurrentCarbonApplicationGrant
      security: [{ iamBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/GrantIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Grant and its token families revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/login/challenges:
    post:
      tags: [Carbon authentication]
      operationId: createLoginChallenge
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginChallengeCreate' }
      responses:
        '201':
          description: Uniform challenge response whether or not the identity exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/login/challenges/{session_id}/verify:
    post:
      tags: [Carbon authentication]
      operationId: verifyLoginChallenge
      security: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/VerificationCode' }
      responses:
        '200':
          description: Carbon session established and every code in the challenge consumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamTokenResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/step-up/challenges:
    post:
      tags: [Carbon authentication]
      operationId: createStepUpChallenge
      security: [{ iamBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpChallengeCreate' }
      responses:
        '201':
          description: Reauthentication code sent to a verified channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/step-up/challenges/{session_id}/verify:
    post:
      tags: [Carbon authentication]
      operationId: verifyStepUpChallenge
      security: [{ iamBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/VerificationCode' }
      responses:
        '200':
          description: Five-minute action-bound step-up token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/step-up/passkey/options:
    post:
      tags: [Carbon authentication]
      operationId: createPasskeyStepUpOptions
      security: [{ iamBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyStepUpCreate' }
      responses:
        '201':
          description: Short-lived WebAuthn assertion ceremony bound to action, resource, origin, and current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyAssertionOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/step-up/passkey/verify:
    post:
      tags: [Carbon authentication]
      operationId: verifyPasskeyStepUp
      security: [{ iamBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyAssertionVerify' }
      responses:
        '200':
          description: Phishing-resistant five-minute step-up token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/tokens/refresh:
    post:
      tags: [Carbon authentication]
      operationId: refreshIamToken
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Rotated tokens; reuse of a consumed refresh token revokes its family.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/tokens/introspect:
    post:
      tags: [Carbon authentication]
      operationId: introspectIamToken
      security: [{ applicationBasic: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgContext' }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenIntrospectionRequest' }
      responses:
        '200':
          description: Current token, principal, scope, session, and membership state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIntrospection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/tokens/revoke:
    post:
      tags: [Carbon authentication]
      operationId: revokeIamToken
      security: [{ iamBearer: [] }, { applicationBasic: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRevocationRequest' }
      responses:
        '204': { description: Token or family revoked; unknown values are treated idempotently. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/logout:
    post:
      tags: [Carbon authentication]
      operationId: logout
      security: [{ iamBearer: [] }, { sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Selected families revoked and application logout events queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/me:
    get:
      tags: [Carbon account]
      operationId: getCurrentCarbon
      security: [{ iamBearer: [] }]
      responses:
        '200':
          description: Current Carbon including self-only contact details.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarbonSelf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Carbon account]
      operationId: updateCurrentCarbon
      security: [{ iamBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CarbonProfilePatch' }
      responses:
        '200':
          description: Profile updated.
