          items: { $ref: '#/components/schemas/InvitationTagTrustOverride' }
        silicon_trust_overrides:
          type: array
          maxItems: 500
          default: []
          description: At most one override per active Silicon membership.
          items: { $ref: '#/components/schemas/InvitationSiliconTrustOverride' }
