        updated_at: { type: string, format: date-time }
    MembershipPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    MembershipDirectoryPatch:
