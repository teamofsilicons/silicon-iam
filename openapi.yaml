webhooks:
  applicationEvent:
    post:
      tags: [Webhooks]
      operationId: deliverApplicationWebhookEvent
      summary: IAM delivers a minimal versioned event to the application's one active HTTPS endpoint.
      security: []
      parameters:
        - { name: X-Silicon-IAM-Event-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Silicon-IAM-Timestamp, in: header, required: true, schema: { type: integer } }
        - { name: X-Silicon-IAM-Key-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Silicon-IAM-Signature, in: header, required: true, schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Event accepted idempotently. }
        '202': { description: Event accepted for asynchronous local processing. }
        '204': { description: Event accepted with no response body. }
  siliconIamEvent:
    post:
      tags: [Webhooks]
      operationId: deliverSiliconIamEvent
      summary: IAM delivers initialization and organization changes to the provisioned Silicon IAM Hook.
      security: []
      parameters:
        - { name: X-Silicon-IAM-Event-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Silicon-IAM-Timestamp, in: header, required: true, schema: { type: integer } }
        - { name: X-Silicon-IAM-Signature, in: header, required: true, schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Event accepted idempotently. }
        '202': { description: Event accepted for asynchronous local processing. }
        '204': { description: Event accepted with no response body. }

components:
  securitySchemes:
    iamBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque IAM access token
      description: Carbon, Silicon, or actor-bound application access token; actor class is checked per operation.
    sessionCookie:
      type: apiKey
      in: cookie
      name: iam_session
      description: Secure, HttpOnly, SameSite browser session used only by interactive authorization flows.
    applicationBasic:
      type: http
      scheme: basic
      description: Application ID as username and current versioned application secret as password.
    platformAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque platform-admin access token
      description: IAM token whose current Carbon principal has active platform-administrator authority.
    stepUpToken:
      type: apiKey
      in: header
      name: X-Step-Up-Token
      description: Five-minute action-bound token from the step-up verification flow.
    workosSignature:
      type: apiKey
      in: header
      name: WorkOS-Signature
      description: >-
        Comma-delimited `t=<epoch_ms>,v1=<hex_hmac>` value. IAM verifies
        HMAC-SHA256 over `timestamp + '.' + exact raw UTF-8 body` in constant
        time, enforces a 300-second tolerance, and deduplicates provider event ID.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated key. Reuse with different bytes returns idempotency_conflict.
      schema: { type: string, minLength: 16, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the expected aggregate version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 512 }
    OrgContext:
      name: X-Org-ID
      in: header
      required: false
      description: Explicit downstream organization context; it must agree with the token, path, and grant.
      schema: { $ref: '#/components/schemas/OrgId' }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CarbonIdPath:
      name: carbon_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CarbonId' }
    OrgIdPath:
      name: org_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrgId' }
    AppIdPath:
      name: app_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AppId' }
    SiliconIdPath:
      name: silicon_id
      in: path
      required: true
      description: Global Silicon handle including the organization suffix.
      schema: { $ref: '#/components/schemas/SiliconGlobalId' }
    PrincipalIdPath:
      name: principal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipIdPath:
      name: membership_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteIdPath:
      name: invite_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantIdPath:
      name: grant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalRequestIdPath:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagIdPath:
      name: tag_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrustRuleIdPath:
      name: rule_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryIdPath:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PasskeyCredentialIdPath:
      name: credential_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor scoped to the filters and caller.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  headers:
    RequestId:
      description: Trace identifier generated or accepted from X-Request-ID.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ETag:
      description: Strong aggregate-version ETag.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    RetryAfter:
      description: Seconds before retrying.
      schema: { type: integer, minimum: 1 }
    RateLimitLimit:
      description: Effective request limit for the tightest active bucket.
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: Remaining requests in that bucket.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Seconds until that bucket resets.
      schema: { type: integer, minimum: 0 }
    IdempotencyReplayed:
      description: True when this is a replay of the stored idempotent response.
      schema: { type: boolean }
  requestBodies:
    VerificationCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [verification_code]
            additionalProperties: false
            properties:
              verification_code: { $ref: '#/components/schemas/VerificationCode' }
  responses:
    HealthOk:
      description: Process is healthy for the requested probe.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties: { ok: { const: true } }
    CodeDispatchAccepted:
      description: Uniform acceptance; it does not reveal whether an identity exists or a provider message was sent.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeDispatchResult' }
    Verified:
      description: Verification completed and the OTP was consumed atomically.
      content:
        application/json:
          schema:
            type: object
            required: [verified]
            properties: { verified: { const: true } }
    BadRequest:
      description: Malformed syntax, unsupported media type, or invalid protocol request.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing, invalid, expired, or revoked authentication.
      headers: { WWW-Authenticate: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated principal lacks the current actor type, scope, capability, or step-up authorization.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource is absent or intentionally hidden across a tenant boundary.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Unique, idempotency, replay, terminal-state, or concurrent-state conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: One-time challenge, authorization code, invitation, proof, or response window expired.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PreconditionFailed:
      description: If-Match does not equal the current aggregate version.
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Request body exceeds the endpoint's configured bound.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Well-formed request violates field, policy, hierarchy, quorum, or tenant invariants.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PreconditionRequired:
      description: Required Idempotency-Key, If-Match, or step-up precondition is absent.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: One or more distributed rate-limit buckets are exhausted.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BadGateway:
      description: Authenticated upstream provider returned an invalid or failed response.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Required local dependency or provider is temporarily unavailable.
      headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GatewayTimeout:
      description: A bounded server or provider processing deadline elapsed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
            message: { type: string, minLength: 1, maxLength: 500 }
            details: { type: object, additionalProperties: true }
            request_id: { type: string, minLength: 1, maxLength: 128 }
    VersionInfo:
      type: object
      required: [service, api_version, build, commit]
      properties:
        service: { const: silicon-iam }
        api_version: { const: v1 }
        build: { type: string }
        commit: { type: string }
    OpenIdConfiguration:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri, introspection_endpoint, revocation_endpoint, response_types_supported, grant_types_supported, code_challenge_methods_supported]
      additionalProperties: true
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        introspection_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        response_types_supported: { type: array, items: { const: code } }
        grant_types_supported: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
        code_challenge_methods_supported: { type: array, items: { const: S256 } }
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg]
            additionalProperties: true
            properties:
              kty: { type: string }
              kid: { type: string }
              use: { const: sig }
              alg: { type: string }
    VerificationCode: { type: string, pattern: '^[0-9]{6}$' }
    CarbonId: { type: string, pattern: '^[a-z0-9_-]{3,30}$' }
    OrgId: { type: string, pattern: '^[a-z0-9_-]{3,50}$' }
    AppId: { type: string, pattern: '^[a-z][a-z0-9_-]{2,79}$' }
    SiliconLocalId: { type: string, pattern: '^[a-z0-9_-]{3,50}$' }
    SiliconGlobalId: { type: string, pattern: '^[a-z0-9_-]{3,50}:[a-z0-9_-]{3,50}$' }
    EmailInput:
      type: object
      required: [email]
      additionalProperties: false
      properties: { email: { type: string, format: email, maxLength: 320 } }
    PhoneInput:
      type: object
      required: [phone_number]
      additionalProperties: false
      properties: { phone_number: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' } }
    AuthSession:
      type: object
      required: [session_id, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    CodeDispatchResult:
      type: object
      required: [accepted, expires_in]
      properties:
        accepted: { const: true }
        expires_in: { type: integer, const: 600 }
    Availability:
      type: object
      required: [available]
      properties: { available: { type: boolean } }
    ActorRef:
      type: object
      required: [principal_id, type, public_id]
      additionalProperties: false
      properties:
        principal_id: { type: string, format: uuid }
        type: { type: string, enum: [carbon, silicon, application, service] }
        public_id: { type: string }
    CarbonPublic:
      type: object
      required: [principal_id, carbon_id, display_name, profile_photo, created_at]
      properties:
        principal_id: { type: string, format: uuid }
        carbon_id: { $ref: '#/components/schemas/CarbonId' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        profile_photo: { type: string, format: uri, maxLength: 2048 }
        created_at: { type: string, format: date-time }
    CarbonSelf:
      allOf:
        - { $ref: '#/components/schemas/CarbonPublic' }
        - type: object
          required: [email, phone_number, status, version, updated_at]
          properties:
            email: { type: string, format: email }
            phone_number: { type: string }
            status: { type: string, enum: [active, suspended, deletion_pending] }
            version: { type: integer, minimum: 1 }
            updated_at: { type: string, format: date-time }
    CarbonSignupComplete:
      type: object
      required: [carbon_id, display_name]
      additionalProperties: false
      properties:
        carbon_id: { $ref: '#/components/schemas/CarbonId' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        profile_photo: { type: [string, 'null'], format: uri, maxLength: 2048 }
    CarbonProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        profile_photo: { type: [string, 'null'], format: uri, maxLength: 2048 }
    CarbonStatusReplace:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    CarbonAdminStatus:
      type: object
      required: [principal, status, version, updated_at]
      properties:
        principal: { $ref: '#/components/schemas/ActorRef' }
        status: { type: string, enum: [active, suspended, deletion_pending] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    LoginChallengeCreate:
      type: object
      minProperties: 1
      maxProperties: 1
      oneOf:
        - { required: [email] }
        - { required: [phone_number] }
        - { required: [carbon_id] }
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        phone_number: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        carbon_id: { $ref: '#/components/schemas/CarbonId' }
    StepUpAction:
      type: string
      enum:
        - account.contact_change
        - account.delete
        - organization.transfer_ownership
        - organization.authorization_change
        - organization.sso_change
        - silicon.rotate_token
        - application.delete
        - application.rotate_secret
        - application.manage_collaborators
        - platform_admin.manage
        - platform_admin.application_review
    StepUpChallengeCreate:
      type: object
      required: [channel, action]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [email, phone_number] }
        action: { $ref: '#/components/schemas/StepUpAction' }
        resource_id: { type: [string, 'null'], format: uuid }
    StepUpTokenResponse:
      type: object
      required: [step_up_token, action, assurance, expires_in]
      properties:
        step_up_token: { type: string, pattern: '^sup_[A-Za-z0-9_-]{43}$' }
        action: { $ref: '#/components/schemas/StepUpAction' }
        assurance: { type: string, enum: [verified_channel, phishing_resistant] }
        expires_in: { type: integer, const: 300 }
    Passkey:
      type: object
      required: [id, name, transports, backup_eligible, backup_state, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        transports: { type: array, uniqueItems: true, items: { type: string, enum: [usb, nfc, ble, internal, hybrid] } }
        backup_eligible: { type: boolean }
        backup_state: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
    PasskeyStepUpCreate:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { $ref: '#/components/schemas/StepUpAction' }
        resource_id: { type: [string, 'null'], format: uuid }
    PasskeyAssertionOptions:
      type: object
      required: [ceremony_id, public_key, expires_at]
      properties:
        ceremony_id: { type: string, format: uuid }
        public_key:
          type: object
          required: [challenge, rpId, allowCredentials, userVerification]
          additionalProperties: true
          properties:
            challenge: { type: string }
            rpId: { type: string, format: hostname }
            allowCredentials: { type: array, items: { type: object, additionalProperties: true } }
            userVerification: { const: required }
        expires_at: { type: string, format: date-time }
    PasskeyAssertionVerify:
      type: object
      required: [ceremony_id, credential]
      additionalProperties: false
      properties:
        ceremony_id: { type: string, format: uuid }
        credential: { type: object, additionalProperties: true }
    PasskeyRegistrationOptions:
      type: object
      required: [ceremony_id, public_key, expires_at]
      properties:
        ceremony_id: { type: string, format: uuid }
        public_key:
          type: object
          required: [challenge, rp, user, pubKeyCredParams, attestation]
          additionalProperties: true
          properties:
            challenge: { type: string }
            rp: { type: object, additionalProperties: true }
            user: { type: object, additionalProperties: true }
            pubKeyCredParams: { type: array, items: { type: object, additionalProperties: true } }
            attestation: { type: string, enum: [none, indirect, direct, enterprise] }
        expires_at: { type: string, format: date-time }
    PasskeyRegistrationVerify:
      type: object
      required: [ceremony_id, name, credential]
      additionalProperties: false
      properties:
        ceremony_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        credential: { type: object, additionalProperties: true }
    IamTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at, actor, session_id]
      properties:
        access_token: { type: string, pattern: '^iat_[A-Za-z0-9_-]{43}$' }
        refresh_token: { type: string, pattern: '^rft_[A-Za-z0-9_-]{43}$' }
        token_type: { const: Bearer }
        expires_in: { type: integer, const: 900 }
        refresh_expires_at: { type: string, format: date-time, description: At most 365 days from family creation. }
        actor: { $ref: '#/components/schemas/ActorRef' }
        session_id: { type: string, format: uuid }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 32, maxLength: 512 }
    TokenRevocationRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 4096 }
        token_type_hint: { type: string, enum: [access_token, refresh_token] }
        revoke_family: { type: boolean, default: false }
    TokenIntrospectionRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 4096 }
        token_type_hint: { type: string, enum: [access_token, refresh_token] }
    TokenIntrospection:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        principal_id: { type: string, format: uuid }
        actor_type: { type: string, enum: [carbon, silicon, application, service] }
        client_id: { $ref: '#/components/schemas/AppId' }
        org_id: { $ref: '#/components/schemas/OrgId' }
        membership_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        scope: { type: string }
        audience: { type: string }
        issued_at: { type: integer }
        expires_at: { type: integer }
        authorization_epoch: { type: integer, minimum: 0 }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [current_session, all_sessions], default: current_session }
    Session:
      type: object
      required: [session_id, actor, status, created_at, last_used_at, absolute_expires_at]
      properties:
        session_id: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/ActorRef' }
        status: { type: string, enum: [active, revoked, expired, replay_revoked] }
        user_agent_summary: { type: [string, 'null'], maxLength: 500 }
        ip_prefix: { type: [string, 'null'], maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    SessionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    LoginEvent:
      type: object
      required: [id, actor, event_type, occurred_at, success, request_id]
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/ActorRef' }
        app_id: { type: [string, 'null'] }
        org_id: { type: [string, 'null'] }
        event_type: { type: string, enum: [login_challenge, login_success, login_failure, oauth_authorization, oauth_token_exchange, logout, refresh_replay] }
        success: { type: boolean }
        ip_prefix: { type: [string, 'null'] }
        user_agent_summary: { type: [string, 'null'] }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }
    LoginEventPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LoginEvent' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    SiliconAuthenticationRequest:
      type: object
      required: [silicon_id, silicon_token]
      additionalProperties: false
      properties:
        silicon_id: { $ref: '#/components/schemas/SiliconGlobalId' }
        silicon_token: { type: string, pattern: '^stk-[a-f0-9]{64}$' }
    OAuthConsentDecision:
      type: object
      required: [authorization_transaction_id, decision]
      additionalProperties: false
      properties:
        authorization_transaction_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, deny] }
    OAuthTokenRequest:
      type: object
      oneOf:
        - required: [grant_type, client_id, code, redirect_uri, code_verifier]
          properties: { grant_type: { const: authorization_code } }
        - required: [grant_type, client_id, refresh_token]
          properties: { grant_type: { const: refresh_token } }
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { $ref: '#/components/schemas/AppId' }
        code: { type: string, minLength: 32, maxLength: 512 }
        redirect_uri: { type: string, format: uri, maxLength: 2048 }
        code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
        refresh_token: { type: string, minLength: 32, maxLength: 512 }
    OAuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, scope, actor]
      properties:
        access_token: { type: string, pattern: '^oat_[A-Za-z0-9_-]{43}$' }
        refresh_token: { type: string, pattern: '^ort_[A-Za-z0-9_-]{43}$' }
        id_token: { type: string, description: Signed compact JWT returned only when the effective scopes contain openid. }
        token_type: { const: Bearer }
        expires_in: { type: integer, const: 900 }
        scope: { type: string }
        actor: { $ref: '#/components/schemas/ActorRef' }
        org_id: { type: [string, 'null'] }
    OAuthRevocationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 4096 }
        token_type_hint: { type: string, enum: [access_token, refresh_token] }
    UserInfo:
      type: object
      required: [sub, actor_type, public_id]
      properties:
        sub: { type: string, format: uuid }
        actor_type: { type: string, enum: [carbon, silicon] }
        public_id: { type: string }
        name: { type: string }
        picture: { type: string, format: uri }
        email: { type: string, format: email }
        phone_number: { type: string }
        org_id: { type: string }
        membership_id: { type: string, format: uuid }
        org_role: { type: string, enum: [owner, admin, member] }
        job_role: { type: string }
        tags: { type: array, items: { type: string } }
    ApplicationGrant:
      type: object
      required: [id, app_id, actor, scopes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        app_id: { $ref: '#/components/schemas/AppId' }
        actor: { $ref: '#/components/schemas/ActorRef' }
        org_id: { type: [string, 'null'] }
        scopes: { type: array, uniqueItems: true, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationGrantPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApplicationGrant' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    OrganizationCreate:
      type: object
      required: [org_id, name]
      additionalProperties: false
      properties:
        org_id: { $ref: '#/components/schemas/OrgId' }
        name: { type: string, minLength: 1, maxLength: 200 }
        logo: { type: [string, 'null'], format: uri, maxLength: 2048 }
        description: { type: [string, 'null'], maxLength: 5000 }
    OrganizationPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        logo: { type: [string, 'null'], format: uri, maxLength: 2048 }
        description: { type: [string, 'null'], maxLength: 5000 }
        join_method: { type: string, enum: [email, sso] }
    Organization:
      type: object
      required: [id, org_id, name, owner_membership_id, join_method, sso_status, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { $ref: '#/components/schemas/OrgId' }
        name: { type: string }
        logo: { type: [string, 'null'], format: uri }
        description: { type: [string, 'null'] }
        owner_membership_id: { type: string, format: uuid }
        join_method: { type: string, enum: [email, sso] }
        sso_status: { type: string, enum: [disabled, pending, active, error] }
        status: { type: string, enum: [active, disabled] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    OwnershipTransfer:
      type: object
      required: [new_owner_membership_id]
      additionalProperties: false
      properties:
        new_owner_membership_id: { type: string, format: uuid }
    OrganizationCapability:
      type: string
      enum:
        - organization.update
        - members.invite
        - members.update_directory
        - members.remove
        - silicons.create
        - silicons.update_directory
        - silicons.manage_hierarchy
        - silicons.remove
        - silicons.rotate_token
        - tags.manage
        - trust.manage
        - roles.request
        - roles.approve
        - admins.create
        - admins.manage
        - sso.manage
        - audit.read
    MachineCapability:
      type: string
      description: >-
        Silicon-facing projection of the fixed organization capability catalog.
        Values persist in the same organization capability-grant table and are
        restricted to entries whose catalog row allows Silicon principals.
      enum:
        - members.update_directory
