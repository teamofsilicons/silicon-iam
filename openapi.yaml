        role: { $ref: '#/components/schemas/DirectoryRole' }
        org: { $ref: '#/components/schemas/DirectoryOrganization' }
        tags: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/TagSummary' } }
        trust:
          oneOf:
            - { $ref: '#/components/schemas/TrustEvaluation' }
            - { type: 'null' }
    DirectoryPage:
