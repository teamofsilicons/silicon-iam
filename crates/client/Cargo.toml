[package]
name = "silicon-iam-client"
version = "0.1.0"
description = "Client for the Silicon IAM API: identity, organization governance, application login, and delegated access."
keywords = ["iam", "identity", "authentication", "authorization", "client"]
categories = ["api-bindings", "authentication"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
# Points at the copy in this crate root, which is what the packaged
# archive carries; the workspace value would resolve outside it.
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true

[lib]
name = "silicon_iam_client"
path = "src/lib.rs"

[dependencies]
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
