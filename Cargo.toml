[package]
name = "silicon-iam"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false
default-run = "iam-api"

[lib]
name = "silicon_iam"
path = "src/lib.rs"

[[bin]]
name = "iam-api"
path = "src/bin/iam_api.rs"

[[bin]]
name = "iam-worker"
path = "src/bin/iam_worker.rs"

[[bin]]
name = "iam-migrate"
path = "src/bin/iam_migrate.rs"

[[bin]]
name = "iam-bootstrap-admin"
path = "src/bin/iam_bootstrap_admin.rs"

[[bin]]
name = "iam-activate-key-version"
path = "src/bin/iam_activate_key_version.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "matched-path"] }
base64 = "0.22.1"
bytes = "1.11.0"
clap = { version = "4.5.48", features = ["derive"] }
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
futures = "0.3.31"
garde = { version = "0.23.0", default-features = false, features = ["email"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "http2",
  "json",
  "rustls",
  "stream",
] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.22.0", default-features = false }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls-ring-native-roots",
  "uuid",
] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = "0.5.2"
tower-http = { version = "0.7.0", features = [
  "catch-panic",
  "cors",
  "limit",
  "sensitive-headers",
  "set-header",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = [
  "danger-allow-state-serialisation",
  "danger-credential-internals",
] }
zeroize = "1.8.2"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
