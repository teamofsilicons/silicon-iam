name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IAM_ENVIRONMENT: test
  IAM_PUBLIC_BASE_URL: http://127.0.0.1:8080
  IAM_AUTH_BASE_URL: http://127.0.0.1:3000
  IAM_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
  IAM_DATABASE_URL: postgres://silicon_iam_api_runtime:api-test-password@127.0.0.1:5432/silicon_iam
  IAM_MIGRATOR_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/silicon_iam
  IAM_KEY_OPERATOR_DATABASE_URL: postgres://silicon_iam_key_operator_runtime:key-operator-test-password@127.0.0.1:5432/silicon_iam
  IAM_TOKEN_PEPPER_CURRENT_VERSION: "1"
  IAM_TOKEN_PEPPER_KEYRING: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE"}'
  IAM_BLIND_INDEX_CURRENT_VERSION: "1"
  IAM_BLIND_INDEX_KEYRING: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAI"}'
  IAM_ENCRYPTION_CURRENT_VERSION: "1"
  IAM_ENCRYPTION_KEYRING: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM"}'
  IAM_COOKIE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQ
  IAM_JWT_ED25519_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAU
  IAM_JWT_KEY_ID: ci-test-key
  IAM_ALLOW_LOCAL_PROVIDERS: "true"
  IAM_EXPOSE_LOCAL_OTPS: "false"

jobs:
  quality:
    name: Format, lint, test, and database smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: silicon_iam
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname silicon_iam"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate formatting
        run: cargo fmt --all --check

      - name: Lint every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Confirm the client wire types still match the contract
        run: |
          ruby scripts/generate-client-models.rb
          # The committed file is generator output *and* rustfmt output, since
          # it is ordinary source held to the same formatting as the rest. The
          # check has to reproduce both steps or it only measures line wrapping.
          cargo fmt -p silicon-iam-client
          git diff --exit-code crates/client/src/models.rs

      - name: Run live PostgreSQL protocol tests
        run: cargo test -p silicon-iam --all-features --locked --lib -- --ignored --test-threads=1

      - name: Validate OpenAPI document
        run: ruby scripts/check-openapi-routes.rb

      - name: Validate migration privilege boundaries
        run: ruby scripts/check-migration-security.rb

      - name: Validate runtime database grants
        run: ruby scripts/check-runtime-grants.rb

      - name: Provision restricted runtime roles
        env:
          IAM_LOCAL_API_DATABASE_PASSWORD: api-test-password
          IAM_LOCAL_WORKER_DATABASE_PASSWORD: worker-test-password
          IAM_LOCAL_KEY_OPERATOR_DATABASE_PASSWORD: key-operator-test-password
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          PGPORT: "5432"
          POSTGRES_DB: silicon_iam
          POSTGRES_USER: postgres
        run: ./deploy/postgres/init-runtime-roles.sh

      - name: Apply fresh PostgreSQL migrations
        run: cargo run --locked --bin iam-migrate

      - name: Exercise one-time platform-administrator bootstrap
        env:
          PGDATABASE: silicon_iam
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          PGUSER: postgres
        run: |
          psql --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO iam.cryptographic_key_versions (purpose, key_version, status)
          VALUES
            ('contact_aead', 1, 'active'),
            ('contact_lookup_hmac', 1, 'active');
          INSERT INTO iam.principals (id, kind, status, activated_at)
          VALUES (
            '11111111-1111-7111-8111-111111111111',
            'carbon',
            'active',
            transaction_timestamp()
          );
          INSERT INTO iam.carbons (id, carbon_id, display_name)
          VALUES (
            '11111111-1111-7111-8111-111111111111',
            'ci_admin',
            'CI Administrator'
          );
          INSERT INTO iam.carbon_contacts (
            id,
            carbon_id,
            kind,
            ciphertext,
            nonce,
            encryption_key_version,
            verified_at
          )
          VALUES
            (
              '22222222-2222-7222-8222-222222222222',
              '11111111-1111-7111-8111-111111111111',
              'email',
              decode(repeat('01', 17), 'hex'),
              decode(repeat('02', 12), 'hex'),
              1,
              transaction_timestamp()
            ),
            (
              '33333333-3333-7333-8333-333333333333',
              '11111111-1111-7111-8111-111111111111',
              'phone',
              decode(repeat('03', 17), 'hex'),
              decode(repeat('04', 12), 'hex'),
              1,
              transaction_timestamp()
            );
          INSERT INTO iam.contact_blind_indexes (
            contact_id,
            contact_kind,
            hmac_key_version,
            digest
          )
          VALUES
            (
              '22222222-2222-7222-8222-222222222222',
              'email',
              1,
              decode(repeat('aa', 32), 'hex')
            ),
            (
              '33333333-3333-7333-8333-333333333333',
              'phone',
              1,
              decode(repeat('bb', 32), 'hex')
            );
          COMMIT;
          SQL
          cargo run --quiet --locked --bin iam-bootstrap-admin -- --carbon-id ci_admin
          if cargo run --quiet --locked --bin iam-bootstrap-admin -- --carbon-id ci_admin \
            >/tmp/silicon-iam-bootstrap-replay.log 2>&1; then
            cat /tmp/silicon-iam-bootstrap-replay.log
            exit 1
          fi
          test "$(psql --tuples-only --no-align --command "
            SELECT
              (SELECT count(*) FROM iam.platform_role_grants
                WHERE role = 'platform_administrator' AND grant_source = 'bootstrap')
              || ':' ||
              (SELECT count(*) FROM iam.audit_events
                WHERE action = 'platform.administrator.bootstrap')
              || ':' ||
              (SELECT count(*) FROM iam.outbox_events
                WHERE event_type = 'platform_administrator.granted.v1')
          ")" = "1:1:1"

      - name: Apply least-privilege runtime grants
        env:
          PGDATABASE: silicon_iam
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          PGUSER: postgres
        run: psql --set=ON_ERROR_STOP=1 --file=deploy/postgres/runtime-grants.sql

      - name: Smoke-test worker through the restricted role
        env:
          IAM_DATABASE_URL: postgres://silicon_iam_worker_runtime:worker-test-password@127.0.0.1:5432/silicon_iam
          IAM_RETENTION_SWEEP_INTERVAL_SECONDS: "10"
          IAM_SHUTDOWN_TIMEOUT_SECONDS: "5"
        run: |
          cargo run --locked --bin iam-worker >/tmp/silicon-iam-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "${worker_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep --quiet 'Silicon IAM worker started' /tmp/silicon-iam-worker.log; then
              break
            fi
            if ! kill -0 "${worker_pid}" 2>/dev/null; then
              cat /tmp/silicon-iam-worker.log
              exit 1
            fi
            sleep 1
          done
          if ! grep --quiet 'Silicon IAM worker started' /tmp/silicon-iam-worker.log; then
            cat /tmp/silicon-iam-worker.log
            exit 1
          fi
          sleep 11
          if ! kill -0 "${worker_pid}" 2>/dev/null; then
            cat /tmp/silicon-iam-worker.log
            exit 1
          fi
          kill -TERM "${worker_pid}"
          wait "${worker_pid}"
          trap - EXIT
          if grep --quiet 'worker stage failed' /tmp/silicon-iam-worker.log; then
            cat /tmp/silicon-iam-worker.log
            exit 1
          fi

      - name: Smoke-test API readiness through the restricted role
        run: |
          cargo run --locked --bin iam-api >/tmp/silicon-iam-api.log 2>&1 &
          api_pid=$!
          trap 'kill "${api_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              cat /tmp/silicon-iam-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/silicon-iam-api.log
          exit 1

      - name: Exercise restricted monotonic key activation
        env:
          PGDATABASE: silicon_iam
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          PGUSER: postgres
        run: |
          psql --set=ON_ERROR_STOP=1 --command "
            INSERT INTO iam.cryptographic_key_versions (
              purpose, key_version, status
            ) VALUES ('token_hmac', 2, 'decrypt_only')
          "
          if psql --set=ON_ERROR_STOP=1 --command "
            SELECT * FROM iam_private.activate_runtime_key_version(
              'token_hmac', 1::smallint, 2::smallint
            )
          " >/tmp/silicon-iam-owner-activation.log 2>&1; then
            cat /tmp/silicon-iam-owner-activation.log
            echo 'migration owner unexpectedly passed key-operator role attestation'
            exit 1
          fi
          cargo run --quiet --locked --bin iam-activate-key-version -- \
            --purpose token-hmac \
            --expected-current-version 1 \
            --new-version 2
          test "$(psql --tuples-only --no-align --command "
            SELECT
              (SELECT key_version FROM iam.cryptographic_key_versions
                WHERE purpose = 'token_hmac' AND status = 'active')
              || ':' ||
              (SELECT count(*) FROM iam.runtime_key_activations
                WHERE purpose = 'token_hmac'
                  AND previous_key_version = 1
                  AND activated_key_version = 2
                  AND activated_by = 'silicon_iam_key_operator_runtime')
              || ':' ||
              has_table_privilege(
                'silicon_iam_key_operator_runtime',
                'iam.cryptographic_key_versions',
                'SELECT'
              )
              || ':' ||
              has_function_privilege(
                'silicon_iam_key_operator_runtime',
                'iam_private.reconcile_runtime_keyring(text,smallint,smallint[])',
                'EXECUTE'
              )
          ")" = "2:1:false:false"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
