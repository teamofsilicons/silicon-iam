[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  # SQLx 0.9 uses the next RustCrypto generation while AEAD remains on the
  # audited 0.10 generation.
  "block-buffer@0.12.1",
  "cpufeatures@0.3.1",
  "crypto-common@0.2.2",
  "digest@0.11.3",
  "hmac@0.13.0",
  "sha2@0.11.0",
  # Independent entropy/macro/platform stacks selected by AWS-LC, SQLx,
  # Reqwest and Docker-backed integration tests.
  "getrandom@0.2.17",
  "getrandom@0.4.3",
  "hashbrown@0.16.1",
  "r-efi@5.3.0",
  "rand@0.10.2",
  "rand_core@0.6.4",
  "rand_core@0.10.1",
  "syn@3.0.4",
  "tower-http@0.6.11",
  "windows-sys@0.52.0",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
